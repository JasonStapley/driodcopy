[package]
name = "driodcopy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Concurrent directory copier with a SQLite result log"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
